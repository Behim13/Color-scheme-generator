<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Scheme Generator</title>
    <script
      src="https://kit.fontawesome.com/e18a01379a.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <form action="submit" class="color-chose">
        <input type="color" class="color-input" id="color-input" />
        <select name="color-variant" id="color-variant" class="color-variant">
          <option value="monochrome">Monochrome</option>
          <option value="monochrome-dark">Monochrome-Dark</option>
          <option value="monochrome-light">Monochrome-Light</option>
          <option value="analogic">Analogic</option>
          <option value="complement">Complement</option>
          <option value="analogic-complement">Analogic-Complement</option>
          <option value="triad">Triad</option>
          <option value="quad">Quad</option>
        </select>
        <button class="get-scheme-btn" id="get-scheme-btn">
          Get Color Scheme
        </button>
      </form>
    </header>
    <main>
      <div class="color-section">
        <div class="color"></div>
        <div class="color-info">
          <p>#F55A5A</p>
          <i class="fa-regular fa-copy"></i>
        </div>
      </div>

        </div>
      </div>

          <p>#F55A5A</p>
          <i class="fa-regular fa-copy"></i>
        </div>
      </div>

        <div class="color-info">
          <p>#F55A5A</p>
          <i class="fa-regular fa-copy"></i>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
